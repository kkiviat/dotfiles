# ~/.tmux.conf

# ── Leader key ────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix   # double-tap to pass through to inner sessions

# ── General ───────────────────────────────────────────────────────────────────
set -g history-limit 10000
set -g mouse on            # scroll with trackpad/wheel
set -g set-clipboard on
set -g mode-keys vi        # vi keys in copy mode

# Windows and panes start at 1 (more ergonomic than 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on # close a window → no gaps in numbering

# Faster escape-sequence detection (important for neovim)
set -sg escape-time 10

# Reload configuration
bind-key -r r source-file ~/.tmux.conf

# vi for copy mode
setw -g mode-keys vi

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-style "fg=#d4be98"
set -g status-bg default
set -g status-position top
set -g status-interval 1

# ── Splits ────────────────────────────────────────────────────────────────────
# v = side-by-side (vertical bar), h = stacked (horizontal bar)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# ── Kill pane ─────────────────────────────────────────────────────────────────
bind k kill-pane

# ── Tab (window) management ───────────────────────────────────────────────────
bind t switch-client -T tabs
bind -T tabs n new-window
bind -T tabs k kill-window
bind -T tabs Escape switch-client -T root

# ── Switch windows (tabs) — no prefix, Ctrl+h/l ───────────────────────────────
bind -n C-h previous-window
bind -n C-l next-window

# ── Switch panes — no prefix, Alt+hjkl ───────────────────────────────────────
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ── Resize mode — key table, mirrors wezterm's one_shot=false resize_pane mode ─
bind -T resize_pane h     resize-pane -L 1 \; switch-client -T resize_pane
bind -T resize_pane l     resize-pane -R 1 \; switch-client -T resize_pane
bind -T resize_pane k     resize-pane -U 1 \; switch-client -T resize_pane
bind -T resize_pane j     resize-pane -D 1 \; switch-client -T resize_pane
bind -T resize_pane Left  resize-pane -L 1 \; switch-client -T resize_pane
bind -T resize_pane Right resize-pane -R 1 \; switch-client -T resize_pane
bind -T resize_pane Up    resize-pane -U 1 \; switch-client -T resize_pane
bind -T resize_pane Down  resize-pane -D 1 \; switch-client -T resize_pane
bind -T resize_pane Escape switch-client -T root
